<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f5">
  <title>A little question for you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="tiny-heart" aria-hidden="true">♡</div>
    <p class="eyebrow">JUST BETWEEN US</p>
    <h1 id="question">Can we choose each other<br>one more time?</h1>
    <p class="subtitle">No pressure. Just an honest answer, from you.</p>
    <div class="actions" id="actions">
      <button class="yes" id="yesButton" type="button">Yes, I want to ♡</button>
      <button class="no" id="noButton" type="button">Not right now</button>
    </div>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <footer>made with care, whatever your answer</footer>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
